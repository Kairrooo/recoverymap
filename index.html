<style id="css">

*{box-sizing:border-box}

svg.body{width:100%;max-height:520px;display:block}
svg.body .sil{fill:#1d2027;stroke:#30343e;stroke-width:1}

.side{display:flex;flex-direction:column;gap:16px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}

.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden}

.chip.p{border-color:var(--accent);color:var(--accent)}
.chip.s{border-style:dashed;color:#cdd3dd}

.hint{font-size:12px;color:var(--muted);margin-top:6px}
.btn{background:var(--accent);color:#111;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}

.detail .name{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:800;text-transform:uppercase;line-height:1}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;margin-top:8px}
.big{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;margin:12px 0 2px}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0 12px}

.kv dd{margin:0}
.hist{list-style:none;padding:0;margin:8px 0 0;font-size:13px}

.empty{color:var(--muted);font-size:13.5px}
.ready-list{display:flex;flex-wrap:wrap;gap:6px}
.row label{margin-right:-2px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.x:hover{color:var(--red)}

svg.body .hit{fill:none;stroke:transparent;stroke-width:10;pointer-events:stroke;cursor:pointer}
.foot{margin-top:18px;color:var(--muted);font-size:12.5px;line-height:1.55;border-top:1px solid var(--line);padding-top:12px}

.foot b{color:#cdd3dd;font-weight:600}

.cxf{background:var(--panel2);border:1px solid var(--accent);border-radius:12px;padding:12px;margin-top:10px}
.h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}

.ctag{display:inline-block;font-size:10.5px;font-weight:600;color:#111;background:var(--accent);border-radius:5px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.lact{display:flex;align-items:center;gap:4px;flex:none}
.drop li.addown{color:var(--accent);font-weight:600}
.setrow{display:grid;grid-template-columns:16px 1fr 1fr 32px 22px;gap:6px;align-items:center}
.setrow .sn{width:auto;text-align:center;font-weight:600;color:var(--muted)}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--bg);overflow:hidden;min-width:0}
.stp button{flex:none;width:28px;height:34px;background:none;border:0;color:var(--muted);font-size:17px;cursor:pointer}
.stp button:active{background:var(--panel2);color:var(--accent)}
.stp input{flex:1;min-width:0;width:100%!important;border:0!important;border-radius:0!important;background:none!important;padding:6px 0!important}
.tick{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;font-size:15px}
.setrow.done .tick{background:var(--green);border-color:var(--green);color:#0c0d10;font-weight:700}
.setrow.done .stp{border-color:rgba(34,197,94,.5)}
.sethead{display:none}
.setfoot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.restinfo{font-size:12px;color:var(--muted)}
.drop li.dh{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);cursor:default;padding:6px 10px 2px}
.drop li.dh:hover{background:none}
.restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:min(560px,calc(100% - 24px));background:#1f232b;border:1px solid var(--accent);border-radius:14px;overflow:hidden;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.55)}
.restbar.go{border-color:var(--green);background:#13261a}
.rbfill{position:absolute;left:0;top:0;bottom:0;background:rgba(198,244,50,.10);transition:width .25s linear}
.rbin{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px}
.rbt{font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:800;line-height:1}
.restbar.go .rbt{color:var(--green)}
.rbl{font-size:12px;color:var(--muted);margin-top:2px}
.rbb{display:flex;gap:6px}
.rbb button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;cursor:pointer;color:var(--text)}
.tabbar{display:none}
@media (max-width:820px){
 body[data-tab] [data-tab]:not(nav){display:none}
 body[data-tab="body"] [data-tab="body"],body[data-tab="log"] [data-tab="log"],body[data-tab="hist"] [data-tab="hist"],body[data-tab="lib"] [data-tab="lib"]{display:block!important}

 .tabbar button.on{color:var(--accent);background:rgba(198,244,50,.08)}
 .badge:empty{display:none!important}
 .badge{position:absolute;top:2px;right:6px;padding:0 5px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:#111;font-style:normal;font-size:11px;line-height:17px;font-family:Inter,sans-serif}
 .restbar{bottom:calc(72px + env(safe-area-inset-bottom))}
}

.seg.sm button{padding:5px 9px;font-size:12px}
.nums{display:inline-flex;align-items:center;gap:4px}

.sets{margin-top:8px;display:flex;flex-direction:column;gap:6px}

</style>

var BIG = ["Back squat","Front squat","Hack squat","Smith machine squat","Deadlift","Romanian deadlift","Stiff-leg deadlift","Sumo deadlift","Rack pull","Barbell bench press","Incline barbell bench press","Smith machine bench press","Close-grip bench press","Overhead press","Push press","Barbell row","Pendlay row","T-bar row","Leg press","Hip thrust","Good morning","Kroc row"];
var COMPOUND_RE = /press|row|pull-?up|chin-?up|pulldown|dip|lunge|squat|deadlift|thrust|step-up|push-up|swing|carry|walk|pullover/i;
function baseRest(n){
  var e = EXBY[n];
  if (BIG.indexOf(n)>=0) return 180;
  if (COMPOUND_RE.test(n) && !/calf|wrist|tricep|neck/i.test(n)) return 120;
  if (e && e[2].length>=2) return 120;
  return 75;
}
function restFor(n, intensity){
  var own = (lsGet("rm.rest",{})||{})[n];
  if (own) return own;
  var r = baseRest(n) + (intensity==="hard"?30:intensity==="light"?-30:0);
  return Math.max(30, r);
}
function mmss(sec){ sec = Math.max(0, Math.round(sec)); return Math.floor(sec/60)+":"+(sec%60<10?"0":"")+(sec%60); }

function norm(s){ return s.toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim(); }
function lastDoneMap(){
  var m = {};
  ((typeof state!=="undefined" && state && state.sessions)||[]).forEach(function(s){ (s.ex||[]).forEach(function(e){ if (!m[e.n] || s.t>m[e.n]) m[e.n] = s.t; }); });
  return m;
}
function search(q, group){
  var nq = norm(q), words = nq.split(" ").filter(Boolean);
  var out = [];
  EX.forEach(function(e, i){
    if (group && group!=="All" && e[1]!==group) return;
    if (!words.length){ out.push([0,i,e]); return; }
    var name = norm(e[0]), nameT = name.split(" ");
    var hayT = norm(e[0]+" "+e[4]+" "+e[2].concat(e[3]).map(function(m){return MUSCLES[m].n;}).join(" ")+" "+e[1]).split(" ");
    var pre = function(toks){ return words.every(function(w){ return toks.some(function(t){ return t.indexOf(w)===0; }); }); };
    var rank;
    if (name.indexOf(nq)===0) rank = 0;
    else if (name.indexOf(nq)>=0) rank = 1;
    else if (pre(nameT)) rank = 2;
    else if (pre(norm(e[4]+" "+e[2].map(function(m){return MUSCLES[m].n;}).join(" ")).split(" "))) rank = 3;
    else if (pre(hayT)) rank = 4;
    else return;
    out.push([rank,i,e]);
  });
  var ld = lastDoneMap();
  if (words.length) out.sort(function(a,b){ return a[0]-b[0] || ((ld[b[2][0]]||0)-(ld[a[2][0]]||0)) || a[1]-b[1]; });
  return out.map(function(x){ return x[2]; });
}
function musclesFromExercises(list){
  var out = {};
  list.forEach(function(n){ var e = EXBY[n]; if (!e) return;
    e[2].forEach(function(m){ out[m]="p"; });
    e[3].forEach(function(m){ if(!out[m]) out[m]="s"; });
  });
  return out;
}

// ---------- helpers ----------
function pad(n){ return (n<10?"0":"")+n; }
function toLocalInput(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); }
var fmt = new Intl.DateTimeFormat("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
var fmtD = new Intl.DateTimeFormat("en-GB",{weekday:"short",day:"numeric",month:"short"});
function fdate(t){ return fmt.format(new Date(t)); }
function dur(ms){
  ms = Math.abs(ms); var h = Math.floor(ms/3600000), d = Math.floor(h/24); h = h%24;
  var m = Math.floor(ms/60000)%60;
  if (d>0) return d+"d "+h+"h"; if (h>0) return h+"h "+m+"m"; return m+"m";
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function mix(a,b,t){
  var pa=[parseInt(a.substr(1,2),16),parseInt(a.substr(3,2),16),parseInt(a.substr(5,2),16)];
  var pb=[parseInt(b.substr(1,2),16),parseInt(b.substr(3,2),16),parseInt(b.substr(5,2),16)];
  return "rgb("+pa.map(function(v,i){return Math.round(v+(pb[i]-v)*t);}).join(",")+")";
}
function hoursFor(m, role, intensity){ return MUSCLES[m].h * (INT[intensity]||1) * (role==="p"?1:SECONDARY); }
function hits(n, m){ var e = EXBY[n]; return !!e && (e[2].indexOf(m)>=0 || e[3].indexOf(m)>=0); }
function numStr(e){
  var sets = (e.sets||[]).filter(function(x){ return x.r || x.w; });
  if (!sets.length) return "";
  var one = function(x){ return (x.r ? x.r : "?") + (x.w ? "×"+x.w+"kg" : " reps"); };
  var same = sets.every(function(x){ return x.r==sets[0].r && x.w==sets[0].w; });
  if (same && sets.length>1) return sets.length+"×"+(sets[0].r||"?")+(sets[0].w ? " @ "+sets[0].w+"kg" : "");
  if (sets.length===1) return "1×"+(sets[0].r||"?")+(sets[0].w ? " @ "+sets[0].w+"kg" : "");
  return sets.map(one).join(" · ");
}
function lastFor(n){
  var best = null;
  state.sessions.forEach(function(s){
    if (s.id===ui.edit) return;
    s.ex.forEach(function(e){ if (e.n===n && (!best || s.t>best.t)) best = {t:s.t, e:e}; });
  });
  return best;
}
function newEntry(n){
  var l = lastFor(n), e = {n:n, i:"normal", sets:[{r:"", w:""}]};
  if (l){ e.i = l.e.i||"normal"; if (l.e.sets && l.e.sets.length) e.sets = l.e.sets.map(function(x){ return {r:x.r||"", w:x.w||""}; }); }
  return e;
}
function pickedNames(){ return ui.picked.map(function(e){ return e.n; }); }
function computeHours(entries, draft){
  var h = {};
  Object.keys(draft).forEach(function(m){
    var best = null;
    entries.forEach(function(e){ if (hits(e.n, m)){ var k = INT[e.i]||1; if (best===null || k>best) best = k; } });
    h[m] = MUSCLES[m].h * (best===null?1:best) * (draft[m]==="p"?1:SECONDARY);
  });
  return h;
}
function sessHours(s, m){ return (s.h && s.h[m]) || hoursFor(m, s.muscles[m], "normal"); }

function status(m, now){
  var hs = state.sessions.filter(function(s){ return s.muscles[m]; });
  if (!hs.length) return {st:"none", color:"var(--idle)", label:"No data", pct:1};
  var last = 0, readyAt = 0, start = 0;
  hs.forEach(function(s){
    if (s.t > last) last = s.t;
    var r = s.t + sessHours(s, m)*3600000;
    if (r > readyAt){ readyAt = r; start = s.t; }
  });
  var o = {hits:hs, last:last, readyAt:readyAt};
  if (now < readyAt){
    var pct = Math.max(0, Math.min(1, (now-start)/(readyAt-start)));
    o.st = "rec"; o.pct = pct;
    o.color = pct < 0.5 ? mix("#ef4444","#f97316",pct*2) : mix("#f97316","#f59e0b",(pct-0.5)*2);
    o.label = pct < 0.35 ? "Just trained" : "Recovering";
  } else if (now - last > 7*86400000){
    o.st = "over"; o.pct = 1; o.color = "var(--over)"; o.label = "7+ days since";
  } else { o.st = "ready"; o.pct = 1; o.color = "var(--green)"; o.label = "Ready"; }
  return o;
}

// ---------- suggestions ----------
var SPLITS = [
 ["Push day",["chest","upperChest","frontDelt","sideDelt","triceps"]],
 ["Pull day",["lats","upperBack","rearDelt","biceps","traps"]],
 ["Leg day",["quads","hamstrings","glutes","calves","adductors"]],
 ["Upper body",["chest","upperChest","lats","upperBack","sideDelt","rearDelt","biceps","triceps"]],
 ["Arms & core",["biceps","triceps","forearms","abs","obliques"]]
];
function suggest(){
  var now = Date.now(), st = {};
  Object.keys(MUSCLES).forEach(function(m){ st[m] = status(m, now); });
  var best = null;
  SPLITS.forEach(function(sp, idx){
    var score = sp[1].reduce(function(a,m){ return a + st[m].pct; },0)/sp[1].length;
    if (!best || score > best.score + 0.001) best = {name:sp[0], ms:sp[1], score:score, idx:idx};
  });
  var ready = best.ms.filter(function(m){ return st[m].pct>=1; });
  var notReady = best.ms.filter(function(m){ return st[m].pct<1; });
  var picks = [];
  ready.forEach(function(m){
    if (picks.length>=5) return;
    if (picks.some(function(n){ return EXBY[n][2].indexOf(m)>=0; })) return;
    var cands = EX.filter(function(e){ return e[2].indexOf(m)>=0 && picks.indexOf(e[0])<0 && !e[2].concat(e[3]).some(function(x){ return notReady.indexOf(x)>=0 && e[2].indexOf(x)>=0; }); });
    if (!cands.length) return;
    cands.sort(function(a,b){ var la=lastFor(a[0]), lb=lastFor(b[0]); return (lb?lb.t:0)-(la?la.t:0); });
    picks.push(cands[0][0]);
  });
  for (var k=0; picks.length<4 && k<ready.length; k++){
    var iso = EX.filter(function(e){ return e[2].length===1 && e[2][0]===ready[k] && picks.indexOf(e[0])<0; });
    if (iso.length) picks.push(iso[0][0]);
  }
  return {name:best.name, score:best.score, ready:ready, notReady:notReady, picks:picks, st:st};
}

setInterval(function(){ if (ui.rest) tickRest(); }, 250);
function renderInstall(){
  var el = $("install"); if (!el) return;
  if (!WEB || ui.noInstall){ el.innerHTML = ""; return; }
  var standalone = (window.navigator.standalone===true) || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  if (standalone){ el.innerHTML = ""; return; }
  var ua = navigator.userAgent || "", ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  var msg = "";
  if (ui.installEvt) msg = '<b>Install RecoveryMap</b> to open it from your home screen like an app.</div><div class="row" style="margin-top:8px"><button class="btn" id="inst-go">Install app</button>';
  else if (ios) msg = '<b>Install RecoveryMap:</b> tap the <b>Share</b> button in Safari, then <b>Add to Home Screen</b>. It opens like an app and keeps your workouts safer.';
  else { el.innerHTML = ""; return; }
  el.innerHTML = '<div class="install"><div>'+msg+'</div><button class="x" id="inst-x" title="Dismiss">×</button></div>';
}
function addEx(n){ if (pickedNames().indexOf(n)<0) ui.picked.push(newEntry(n)); }
function toggleEx(n){
  var i = pickedNames().indexOf(n);
  if (i>=0) ui.picked.splice(i,1); else ui.picked.push(newEntry(n));
}
function renderDetail(stats, now){
  var el = $("detail");
  if (!ui.sel){ el.innerHTML = '<div class="h2">Muscle info</div><div class="empty">Tap any muscle on the body to see when you last trained it and when it’s ready again.</div>'; return; }
  var m = ui.sel, s = stats[m], M = MUSCLES[m];
  var h = '<div class="name">'+M.n+'</div><span class="badge" style="background:'+s.color+';color:'+(s.st==="none"?"var(--text)":"#111")+'">'+s.label+'</span>';
  if (s.st==="none"){
    h += '<div class="big">Never logged</div><dl class="kv"><dt>Recovery window</dt><dd>'+M.h+'h (normal intensity)</dd></dl>';
  } else {
    h += '<div class="big">'+(s.st==="rec" ? 'Ready in '+dur(s.readyAt-now) : 'Ready now')+'</div>';
    h += '<div class="bar"><div style="width:'+Math.round(s.pct*100)+'%;background:'+s.color+'"></div></div>';
    h += '<dl class="kv"><dt>Last trained</dt><dd>'+fdate(s.last)+' ('+dur(now-s.last)+' ago)</dd>';
    h += '<dt>'+(s.st==="rec"?"Ready at":"Was ready")+'</dt><dd>'+fdate(s.readyAt)+'</dd>';
    h += '<dt>Recovered</dt><dd>'+Math.round(s.pct*100)+'%</dd>';
    h += '<dt>Window</dt><dd>'+M.h+'h primary · '+Math.round(M.h*SECONDARY)+'h secondary (normal)</dd>';
    h += '<dt>Last 7 days</dt><dd>'+s.hits.filter(function(x){ return now-x.t < 7*86400000; }).length+' session(s)</dd></dl>';
    var recent = s.hits.slice().sort(function(a,b){ return b.t-a.t; }).slice(0,3);
    h += '<ul class="hist">'+recent.map(function(x){
      var ex = x.ex.filter(function(e){ return hits(e.n, m); }).map(function(e){ var ns = numStr(e); return esc(e.n)+(ns?' <small class="t">'+esc(ns)+'</small>':''); }).join("<br>");
      return '<li><div>'+(x.name?'<div class="hn">'+esc(x.name)+'</div>':'')+'<div class="t">'+fdate(x.t)+' · '+(x.muscles[m]==="p"?"primary":"secondary")+'</div><div>'+(ex||esc(x.text||""))+'</div></div></li>';
    }).join("")+'</ul>';
  }
  h += '<div class="row"><button class="ghost" data-toggle="'+m+'">'+(ui.draft[m]?"Remove from this session":"+ Add to this session")+'</button></div>';
  el.innerHTML = h;
}

// ---------- persistence ----------
function buildDoc(){
  var json = JSON.stringify(state).replace(/</g,"\\u003c");
  var head = '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RecoveryMap — Gym Recovery Tracker</title>'+
    '<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">';
  return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>"+head+'<style id="css">'+$("css").textContent+"</style></head>\n<body>\n"+
    '<script type="application/json" id="state">'+json+"<\/script>\n"+
    '<script id="app">'+$("app").textContent+"<\/script>\n</body>\n</html>";
}
function persist(){
  saveLocal();
  if (mode==="artifact" && artifactApi){
    $("save").textContent = "Saving…";
    Promise.resolve(artifactApi.publish(buildDoc())).then(function(){ $("save").textContent = "Saved"; })
      .catch(function(e){ var c = e && (e.code||e.name||e.message)||""; $("save").textContent = /conflict/i.test(c) ? "Updated elsewhere — reloading" : "Saved on this device only"; if (!/conflict/i.test(c)) mode="local"; });
  } else { $("save").textContent = "Saved on this device"; }
  renderAll();
}
function resetLog(){ ui.whenTouched=false; $("sname").value=""; ui.picked=[]; ui.q=""; ui.manual={}; ui.edit=null; ui.saving=false; $("txt").value=""; $("when").value = toLocalInput(new Date()); }
function startEdit(id){
  var s = state.sessions.filter(function(x){ return x.id===id; })[0]; if (!s) return;
  ui.edit = id; ui.saving = false; $("sname").value = s.name||"";
  ui.picked = s.ex.map(function(e){ var sets = (e.sets||[]).map(function(x){ return {r:x.r||"", w:x.w||""}; }); if (!sets.length) sets = [{r:"", w:""}]; return {n:e.n, i:e.i||"normal", sets:sets}; });
  var auto = musclesFromExercises(pickedNames()); ui.manual = {};
  Object.keys(s.muscles).forEach(function(m){ if (auto[m]!==s.muscles[m]) ui.manual[m] = s.muscles[m]; });
  Object.keys(auto).forEach(function(m){ if (!s.muscles[m]) ui.manual[m] = "x"; });
  $("when").value = toLocalInput(new Date(s.t));
  renderAll();
  try { $("logcard").scrollIntoView({behavior:"smooth", block:"start"}); } catch(e){}
}
function cleanEntry(e){
  var num = function(v){ v = parseFloat(v); return (!isNaN(v) && v>0) ? v : ""; };
  var sets = (e.sets||[]).map(function(x){ return {r:num(x.r), w:num(x.w)}; }).filter(function(x){ return x.r || x.w; });
  return {n:e.n, i:e.i||"normal", sets:sets};
}

// ---------- events ----------
document.addEventListener("click", function(e){
  var t = e.target; if (!t.closest) return;
  var c;
  if ((c = t.closest("svg [data-m]"))){ var id = c.getAttribute("data-m"); ui.sel = ui.sel===id ? null : id; render(); return; }
  if ((c = t.closest("[data-tabgo]"))){ setTab(c.getAttribute("data-tabgo")); return; }
  if ((c = t.closest("[data-rest]"))){
    var rv = c.getAttribute("data-rest");
    if (!ui.rest) return;
    if (rv==="skip"){ ui.rest = null; tickRest(); return; }
    ui.rest.end += (+rv)*1000; ui.rest.total = Math.max(15, ui.rest.total + (+rv)); ui.rest.alerted = false;
    var prefs = lsGet("rm.rest",{})||{}; prefs[ui.rest.n] = ui.rest.total; lsSet("rm.rest", prefs);
    renderPicked(); tickRest(); return;
  }
  if ((c = t.closest("[data-step]"))){
    var sp = c.getAttribute("data-step").split(":"), se = ui.picked[+sp[0]]; if (!se) return;
    var st = se.sets[+sp[1]]; if (!st) return;
    var f = sp[2], dlt = parseFloat(sp[3]);
    var cur = parseFloat(st[f]);
    if (isNaN(cur)){ var prevS = se.sets[+sp[1]-1]; cur = prevS && parseFloat(prevS[f]) ? parseFloat(prevS[f]) : 0; if (dlt>0 && cur) dlt = 0; }
    var nv = Math.max(0, Math.round((cur + dlt)*10)/10);
    st[f] = nv ? String(nv) : "";
    var inp = document.querySelector('#picked input[data-i="'+sp[0]+'"][data-k="'+sp[1]+'"][data-f="'+f+'"]'); if (inp) inp.value = st[f];
    saveDraft(); return;
  }
  if ((c = t.closest("[data-done]"))){
    var dp2 = c.getAttribute("data-done").split(":"), de2 = ui.picked[+dp2[0]]; if (!de2) return;
    var ds = de2.sets[+dp2[1]]; if (!ds) return;
    ds.d = !ds.d;
    try { if (!audioCtx){ var AC = window.AudioContext||window.webkitAudioContext; if (AC) audioCtx = new AC(); } if (audioCtx && audioCtx.state==="suspended") audioCtx.resume(); } catch(er){}
    if (ds.d && !ui.edit && !ui.whenTouched){ $("when").value = toLocalInput(new Date()); }
    renderPicked(); saveDraft();
    if (ds.d) startRest(+dp2[0]);
    return;
  }
  if ((c = t.closest("[data-again]"))){
    var sa = state.sessions.filter(function(x){ return x.id===c.getAttribute("data-again"); })[0]; if (!sa) return;
    resetLog();
    ui.picked = sa.ex.filter(function(e){ return EXBY[e.n]; }).map(function(e){ var sets = (e.sets||[]).map(function(x){ return {r:x.r||"", w:x.w||""}; }); if (!sets.length) sets = [{r:"",w:""}]; return {n:e.n, i:e.i||"normal", sets:sets}; });
    $("sname").value = sa.name||"";
    renderAll(); setTab("log"); return;
  }
  if ((c = t.closest("[data-delcx]"))){
    if (c.dataset.armed){ var cn = c.getAttribute("data-delcx"); state.custom = state.custom.filter(function(x){ return x.n!==cn; }); syncCustom(); ui.picked = ui.picked.filter(function(x){ return EXBY[x.n]; }); persist(); }
    else { c.dataset.armed = "1"; c.textContent = "Delete?"; c.style.color = "var(--red)"; c.style.fontSize = "12px"; setTimeout(function(){ if (c.isConnected){ delete c.dataset.armed; c.textContent="×"; c.style.color=""; c.style.fontSize=""; } }, 3000); }
    return;
  }
  if ((c = t.closest("[data-addown]"))){ ui.cx = {n:c.getAttribute("data-addown"), g:"Chest", m:{}}; ui.q=""; $("txt").value=""; $("drop").hidden = true; renderCx(); setTab("lib"); try { $("cxform").scrollIntoView({behavior:"smooth", block:"center"}); } catch(er){} return; }
  if ((c = t.closest("[data-cxm]"))){ var mm = c.getAttribute("data-cxm"), cur0 = ui.cx.m[mm]; ui.cx.n = $("cx-name").value; ui.cx.g = $("cx-g").value; if (!cur0) ui.cx.m[mm] = "p"; else if (cur0==="p") ui.cx.m[mm] = "s"; else delete ui.cx.m[mm]; renderCx(); return; }
  if ((c = t.closest("[data-add]"))){ toggleEx(c.getAttribute("data-add")); if (c.closest("#drop")){ ui.q=""; $("txt").value=""; $("txt").focus(); ui.hideRecent = true; } renderAll(); return; }
  if ((c = t.closest("[data-unpick]"))){ ui.picked.splice(+c.getAttribute("data-unpick"),1); renderAll(); return; }
  if ((c = t.closest("[data-addset]"))){
    var ai = +c.getAttribute("data-addset"), en = ui.picked[ai]; if (!en) return;
    var lastSet = en.sets[en.sets.length-1] || {r:"", w:""};
    en.sets.push({r:lastSet.r, w:lastSet.w}); renderPicked();
    var ins = document.querySelectorAll('#picked input[data-i="'+ai+'"][data-f="w"]'); if (ins.length) ins[ins.length-1].focus();
    return;
  }
  if ((c = t.closest("[data-delset]"))){
    var dp = c.getAttribute("data-delset").split(":"), de = ui.picked[+dp[0]]; if (!de) return;
    de.sets.splice(+dp[1],1); if (!de.sets.length) de.sets.push({r:"", w:""}); renderPicked(); return;
  }
  if ((c = t.closest("[data-int]"))){ var pr = c.getAttribute("data-int").split(":"); ui.picked[+pr[0]].i = pr[1]; renderPicked(); return; }
  if ((c = t.closest("[data-g]"))){ ui.libG = c.getAttribute("data-g"); document.querySelectorAll("#libg .tab").forEach(function(b){ b.classList.toggle("on", b===c); }); renderLib(); return; }
  if (!t.closest(".ac")){ $("drop").hidden = true; }
  if ((c = t.closest(".chip[data-m]"))){ var cm = c.getAttribute("data-m"); ui.manual[cm] = ui.draft[cm]==="p" ? "s" : "x"; render(); return; }
  if ((c = t.closest("[data-pick]"))){ ui.sel = c.getAttribute("data-pick"); render(); try { $("detail").scrollIntoView({behavior:"smooth", block:"nearest"}); } catch(er){} return; }
  if ((c = t.closest("[data-toggle]"))){ var tm = c.getAttribute("data-toggle"); ui.manual[tm] = ui.draft[tm] ? "x" : "p"; render(); return; }
  if ((c = t.closest("[data-del]"))){
    if (c.dataset.armed){ var did = c.getAttribute("data-del"); state.sessions = state.sessions.filter(function(s){ return s.id!==did; }); if (ui.edit===did) resetLog(); persist(); }
    else { c.dataset.armed = "1"; c.textContent = "Delete?"; c.style.color = "var(--red)"; c.style.fontSize = "12px"; setTimeout(function(){ if (c.isConnected){ delete c.dataset.armed; c.textContent="×"; c.style.color=""; c.style.fontSize=""; } }, 3000); }
    return;
  }
  if ((c = t.closest("[data-edit]"))){ startEdit(c.getAttribute("data-edit")); setTab("log"); return; }
  if ((c = t.closest("[data-tpl]"))){
    var tp = state.templates.filter(function(x){ return x.id===c.getAttribute("data-tpl"); })[0]; if (!tp) return;
    ui.picked = []; ui.manual = {}; $("sname").value = tp.name;
    tp.ex.forEach(function(te){ var en = newEntry(te.n); en.i = te.i||en.i; ui.picked.push(en); });
    renderAll(); return;
  }
  if ((c = t.closest("[data-deltpl]"))){
    if (c.dataset.armed){ var tid = c.getAttribute("data-deltpl"); state.templates = state.templates.filter(function(x){ return x.id!==tid; }); persist(); }
    else { c.dataset.armed = "1"; c.textContent = "Delete?"; c.style.color = "var(--red)"; setTimeout(function(){ if (c.isConnected){ delete c.dataset.armed; c.textContent="×"; c.style.color=""; } }, 3000); }
    return;
  }
  switch (t.id){
    case "timer-tg": lsSet("rm.timer", !lsGet("rm.timer", true)); if (!lsGet("rm.timer", true)){ ui.rest = null; tickRest(); } renderLogMeta(); return;
    case "cx-open": ui.cx = {n:"", g:ui.libG!=="All"?ui.libG:"Chest", m:{}}; renderCx(); setTimeout(function(){ var n=$("cx-name"); if(n) n.focus(); },0); return;
    case "cx-cancel": ui.cx = null; renderCx(); return;
    case "cx-save":
      var nm2 = ($("cx-name").value||"").trim().replace(/\s+/g," "), g2 = $("cx-g").value;
      nm2 = nm2.charAt(0).toUpperCase()+nm2.slice(1);
      var p2 = Object.keys(ui.cx.m).filter(function(m){ return ui.cx.m[m]==="p"; }), s2 = Object.keys(ui.cx.m).filter(function(m){ return ui.cx.m[m]==="s"; });
      if (!nm2){ $("cx-msg").textContent = "Give it a name."; return; }
      if (EX.some(function(e){ return e[0].toLowerCase()===nm2.toLowerCase(); })){ $("cx-msg").textContent = "That exercise is already in the list."; return; }
      if (!p2.length){ $("cx-msg").textContent = "Pick at least one primary muscle."; return; }
      state.custom.push({n:nm2, g:g2, p:p2, s:s2}); syncCustom(); ui.cx = null;
      addEx(nm2); persist(); return;
    case "inst-x": ui.noInstall = true; try { localStorage.setItem("rm.noinstall","1"); } catch(er){} renderInstall(); return;
    case "inst-go": if (ui.installEvt){ ui.installEvt.prompt(); ui.installEvt = null; renderInstall(); } return;
    case "savetpl": ui.saving = true; renderTemplates(); setTimeout(function(){ var n=$("tplname"); if(n) n.focus(); },0); return;
    case "tplcancel": ui.saving = false; renderTemplates(); return;
    case "tplok":
      var nm = ($("tplname").value||"").trim(); if (!nm || !ui.picked.length) return;
      state.templates = state.templates.filter(function(x){ return x.name.toLowerCase()!==nm.toLowerCase(); });
      state.templates.push({id:Date.now().toString(36), name:nm, ex:ui.picked.map(function(e){ return {n:e.n, i:e.i}; })});
      if (!$("sname").value.trim()) $("sname").value = nm;
      ui.saving = false; persist(); return;
    case "suggest": ui.sug = suggest(); render(); return;
    case "sugclose": ui.sug = null; render(); return;
    case "sugload":
      if (!ui.edit){ ui.picked = []; ui.manual = {}; }
      ui.sug.picks.forEach(addEx); ui.sug = null; renderAll(); setTab("log");
      try { $("logcard").scrollIntoView({behavior:"smooth", block:"start"}); } catch(er){}
      return;
    case "bk-copy":
      ui.backup = "copy"; ui.copied = false;
      var txt = JSON.stringify(state);
      try { navigator.clipboard.writeText(txt).then(function(){ ui.copied = true; render(); }).catch(function(){}); } catch(er){}
      render(); var ta = $("bktext"); if (ta){ ta.focus(); ta.select(); }
      return;
    case "bk-restore": ui.backup = "restore"; render(); return;
    case "bk-cancel": ui.backup = null; render(); return;
    case "bk-do":
      var raw = ($("bkin").value||"").trim(), j = null;
      try { j = JSON.parse(raw); } catch(er){}
      if (!j || !Array.isArray(j.sessions)){ $("bkmsg").textContent = "That doesn’t look like a RecoveryMap backup."; return; }
      if (!t.dataset.armed){ t.dataset.armed = "1"; t.textContent = "Tap again to replace "+state.sessions.length+" session(s)"; return; }
      state = migrate(j); syncCustom(); recomputeHours(); ui.backup = null; resetLog(); persist(); return;
  }
});
document.addEventListener("input", function(e){
  var t = e.target;
  if (t.matches && t.matches("#picked input[data-f]")){ var i = +t.getAttribute("data-i"), k = +t.getAttribute("data-k"); if (ui.picked[i] && ui.picked[i].sets[k]) ui.picked[i].sets[k][t.getAttribute("data-f")] = t.value; saveDraft(); }
  if (t.id==="sname") saveDraft();
  if (t.id==="when"){ ui.whenTouched = true; saveDraft(); }
});
$("txt").addEventListener("input", function(){ ui.q = this.value; ui.hi = 0; ui.hideRecent = false; renderDrop(); });
$("txt").addEventListener("focus", function(){ ui.hideRecent = false; setTimeout(renderDrop, 0); });
$("txt").addEventListener("keydown", function(e){
  var r = ui.q.trim() ? search(ui.q).slice(0,8) : [];
  if (e.key==="ArrowDown"){ ui.hi = Math.min(r.length-1, ui.hi+1); renderDrop(); e.preventDefault(); }
  else if (e.key==="ArrowUp"){ ui.hi = Math.max(0, ui.hi-1); renderDrop(); e.preventDefault(); }
  else if (e.key==="Enter"){ e.preventDefault(); if (r[ui.hi]){ addEx(r[ui.hi][0]); ui.q=""; this.value=""; ui.hideRecent = true; renderAll(); } }
  else if (e.key==="Escape"){ $("drop").hidden = true; }
});
$("libq").addEventListener("input", function(){ ui.libQ = this.value; renderLib(); });
$("clear").addEventListener("click", function(){ resetLog(); renderAll(); });
$("log").addEventListener("click", function(){
  var d = currentDraft(); if (!Object.keys(d).length) return;
  var when = $("when").value ? new Date($("when").value).getTime() : Date.now();
  if (isNaN(when)) when = Date.now();
  var entries = ui.picked.map(cleanEntry);
  var sess = { id: ui.edit || (Date.now().toString(36)+Math.random().toString(36).slice(2,6)), t: when, ex: entries, muscles: d, h: computeHours(entries, d) };
  var nmv = $("sname").value.trim(); if (nmv) sess.name = nmv;
  if (ui.edit) state.sessions = state.sessions.map(function(s){ return s.id===ui.edit ? sess : s; });
  else state.sessions.push(sess);
  ui.rest = null; tickRest();
  resetLog(); lsSet("rm.draft", null); setTab("body"); persist();
});
$("when").value = toLocalInput(new Date());
setInterval(render, 60000);

// ---------- start ----------
state = migrate(state);
loadLocal();
syncCustom();
recomputeHours();
try { ui.noInstall = localStorage.getItem("rm.noinstall")==="1"; } catch(e){}
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); ui.installEvt = e; renderInstall(); });
renderInstall();
loadDraft();
setTab(lsGet("rm.tab","body"));
renderAll();
$("save").textContent = "Saved on this device";
if ("serviceWorker" in navigator) { window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
})();
</script>
</body>
